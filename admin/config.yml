backend:
  name: github
  repo: EPICOMI/decor-station-website
  branch: main
  base_url: https://sveltia-cms-auth.prakharverma2006.workers.dev
  auth_endpoint: auth

# Lets you test the whole CMS locally with `npx @sveltia/cms-proxy`
# alongside `npx @11ty/eleventy --serve`, no Cloudflare/GitHub OAuth needed.
local_backend: true

media_folder: "images"
public_folder: "/images"

collections:
  - name: "products"
    label: "Products"
    folder: "_data/productEntries"
    create: true
    delete: false # keep "delete" disabled -- owner should hide (active: false), not delete
    identifier_field: name # filename/id is auto-derived from this field, owner never sees "id"
    format: json
    fields:
      - { label: "Name", name: "name", widget: "string" }
      - label: "Category"
        name: "category"
        widget: "relation"
        collection: "categories"
        file: "categories"
        value_field: "categories.*"
        search_fields: ["categories.*"]
        display_fields: ["categories.*"]
        hint: 'Pick an existing category, or add a new one first under "Categories" in the sidebar.'
      - { label: "Description", name: "description", widget: "text" }
      - { label: "Price", name: "price", widget: "string" }
      - label: "Images"
        name: "images"
        widget: "list"
        field: { label: "Image", name: "image", widget: "image" }
      - label: "Active"
        name: "active"
        widget: "boolean"
        default: true
        hint: "Uncheck to hide this product from the website without deleting it."

  - name: "categories"
    label: "Categories"
    files:
      - name: "categories"
        label: "Product Categories"
        file: "_data/categories.json"
        fields:
          - label: "Categories"
            name: "categories"
            widget: "list"
            hint: "Add a new category name here first, then it becomes selectable on any product."

  - name: "settings"
    label: "Site Settings"
    files:
      - name: "site"
        label: "General Settings"
        file: "_data/site.json"
        fields:
          - label: "WhatsApp Number"
            name: "whatsappNumber"
            widget: "string"
            hint: "Digits only, with country code, no + or spaces. Example: 6591234567"
          - { label: "Contact Email", name: "contactEmail", widget: "string" }
          - label: "About Page"
            name: "about"
            widget: "object"
            fields:
              - { label: "Heading", name: "heading", widget: "string" }
              - { label: "Body", name: "body", widget: "text" }
